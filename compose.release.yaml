# Docker Hub 发布版 0.5.0：下载此文件即可运行，无需项目源码或本地构建。
# 环境：Docker Compose + Linux amd64 containers + NVIDIA GPU。
# 启动：docker compose -f compose.release.yaml up -d --wait
# 使用说明：https://github.com/sysoebuilder/chinese-legal-agent/blob/main/docs/dockerhub-release.md

# 保留部署标识以复用现有容器和已初始化的命名卷。
name: agent100

# API 和 Worker 使用同一份镜像、配置与资源挂载。
x-agent: &agent
  image: sysoe/chinese-legal-agent:0.5.0
  platform: linux/amd64
  init: true
  restart: unless-stopped
  environment:
    AGENT_DATA_DIR: /app/data
    AGENT_CONFIG_DIR: /app/config
    CHECKPOINT_DATABASE_URL: postgresql://agent100:agent100@postgres:5432/agent100
    AGENT_REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
  volumes:
    - app-data:/app/data
    # 主机目录仅提供模型与工具配置；数据库、索引和安装缓存写入命名卷。
    - ./data:/app/config
    - ./models:/app/models:ro
    - law-assets:/app/laws:ro
  depends_on:
    initialize:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy

services:
  # 一次性初始化配置、法律快照/BM25 和重排模型。
  initialize:
    image: sysoe/chinese-legal-agent-init:0.5.0
    platform: linux/amd64
    init: true
    restart: "no"
    environment:
      AGENT_CONFIG_DIR: /app/config
      AGENT_DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      LAWS_INIT_ENABLED: "true"
      RERANKER_INIT_ENABLED: "true"
    volumes:
      - ./data:/app/config
      - app-data:/app/data
      - ./models:/app/models
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    image: sysoe/chinese-legal-agent-web:0.5.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENT_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端只提供业务接口和 /docs；前端由独立的 frontend 服务提供。
  api:
    <<: *agent
    command: [python, -m, chinese_legal_agent.api, --host, 0.0.0.0, --port, "8001"]
    ports:
      - "127.0.0.1:${AGENT_API_PORT:-8001}:8001"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *agent
    depends_on:
      initialize:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [celery, -A, "chinese_legal_agent.api.celery_app:celery_app", worker, --pool=prefork, --concurrency=1, --loglevel=INFO]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "celery -A chinese_legal_agent.api.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: agent100
      POSTGRES_PASSWORD: agent100
      POSTGRES_DB: agent100
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory-policy, noeviction]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3
          head -n 1 <&3 | grep -q '200'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: agent100_postgres
  qdrant-data:
    name: agent100_qdrant
  app-data:
  law-assets:
  redis-data:
