name: agent100

# API 和 Worker 使用同一份镜像、配置与资源挂载。
x-agent: &agent
  build: .
  image: agent100:local
  init: true
  restart: unless-stopped
  environment:
    AGENT_DATA_DIR: /app/data
    AGENT_CONFIG_DIR: /app/config
    CHECKPOINT_DATABASE_URL: postgresql://agent100:agent100@postgres:5432/agent100
    AGENT_REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
  volumes:
    - app-data:/app/data
    # 主机目录仅提供模型与工具配置；数据库、索引和安装缓存写入命名卷。
    - ./data:/app/config
    - ./models:/app/models:ro
    - law-assets:/app/laws:ro
  depends_on:
    initialize:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy

services:
  # 一次性初始化配置、法律快照/BM25 和重排模型，不依赖宿主终端 MCP。
  initialize:
    build:
      context: .
      dockerfile: Dockerfile.init
    image: agent100-init:local
    init: true
    restart: "no"
    environment:
      AGENT_CONFIG_DIR: /app/config
      AGENT_DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
      LAWS_INIT_ENABLED: "true"
      RERANKER_INIT_ENABLED: "true"
      # 新配置提前启用宿主终端连接；Token 在 provider 启动后从 .env 读取。
      WINDOWS_MCP_URL: http://host.docker.internal:${WINDOWS_MCP_PORT:-8766}/mcp
    volumes:
      - ./data:/app/config
      - app-data:/app/data
      - ./models:/app/models
    depends_on:
      qdrant:
        condition: service_healthy

  # 此入口调用 mcp_terminal.py 的 compose 模式，在 Windows 宿主机运行服务。
  windows_terminal:
    provider:
      # Windows 上 Compose 自动追加 .exe。
      type: ./.venv/Scripts/agent100-mcp-provider
      options:
        port: ${WINDOWS_MCP_PORT:-8766}

  frontend:
    build: ./frontend
    image: agent100-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENT_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端只提供业务接口和 /docs；前端由独立的 frontend 服务提供。
  api:
    <<: *agent
    command: [python, -m, ai_agent_learning.api, --host, 0.0.0.0, --port, "8001"]
    ports:
      - "127.0.0.1:${AGENT_API_PORT:-8001}:8001"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *agent
    depends_on:
      initialize:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      windows_terminal:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [celery, -A, "ai_agent_learning.api.celery_app:celery_app", worker, --pool=prefork, --concurrency=1, --loglevel=INFO]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "celery -A ai_agent_learning.api.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: agent100
      POSTGRES_PASSWORD: agent100
      POSTGRES_DB: agent100
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory-policy, noeviction]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3
          head -n 1 <&3 | grep -q '200'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: agent100_postgres
  qdrant-data:
    name: agent100_qdrant
  app-data:
  law-assets:
  redis-data:
