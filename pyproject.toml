[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-legal-agent"
version = "0.5.0"
description = "A Chinese legal agent for law retrieval and evidence-based case analysis"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=3.3,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "qdrant-client>=1.19,<2",
    "bm25s>=0.3,<1",
    "torch>=2,<3",
    "transformers>=4.38,<6",
    "accelerate>=1,<2",
    "huggingface-hub>=1.5,<2",
    "jieba>=0.42,<1",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary]>=3.3.6,<4",
    "alembic>=1.20,<2",
    "sqlalchemy>=2.0,<3",
    "langchain-community>=0.4,<1",
    "langchain-deepseek>=1.1,<2",
    "PyJWT>=2.10,<3",
    "mcp==2.2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "psutil>=7,<8",
]

[project.scripts]
chinese-legal-agent-mcp-provider = "chinese_legal_agent.mcp_terminal:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chinese_legal_agent*"]

[tool.setuptools]
include-package-data = false
