[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-learning"
version = "0.5.0"
description = "A personal LLM command-line assistant"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=3.3,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "qdrant-client>=1.19,<2",
    "pyarrow>=21,<26",
    "bm25s>=0.3,<1",
    "torch>=2,<3",
    "transformers>=4.38,<6",
    "accelerate>=1,<2",
    "huggingface-hub>=1.5,<2",
    "jieba>=0.42,<1",
    "datasets>=4,<5",
    "rich>=14,<15",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-community>=0.4,<1",
    "langchain-deepseek>=1.1,<2",
    "PyJWT>=2.10,<3",
    "mcp==2.2.0",
]

[project.scripts]
agent100 = "ai_agent_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
ai_agent_learning = [
    "runtime/qdrant.exe",
    "laws/raw/npc/*.parquet",
    "laws/*.zip",
    "laws/*.sha256",
]
